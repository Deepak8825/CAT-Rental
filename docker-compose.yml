# Caterpillar Dealer Asset Management Platform - Docker Compose
# Development environment with all services

version: '3.9'

services:
  # ─── Database ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smart_rental_db
    environment:
      POSTGRES_DB: smart_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── TimescaleDB (IoT Time-Series) ───────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: smart_rental_tsdb
    environment:
      POSTGRES_DB: smart_rental_iot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  # ─── Redis (Cache & Sessions) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smart_rental_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # ─── Kafka (Event Streaming) ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smart_rental_zk
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smart_rental_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ─── MQTT Broker (IoT Devices) ──────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart_rental_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data

  # ─── Elasticsearch (Search & Logs) ──────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: smart_rental_elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  # ─── MinIO (Object Storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: smart_rental_minio
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9090"

  # ─── FastAPI Backend ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_rental_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smart_rental
      REDIS_URL: redis://redis:6379/0
      MQTT_BROKER: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─── React Frontend ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_rental_ui
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # ─── Monitoring ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: smart_rental_prometheus
    ports:
      - "9091:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1.0
    container_name: smart_rental_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  mosquitto_data:
  elastic_data:
  minio_data:
  prometheus_data:
  grafana_data:
